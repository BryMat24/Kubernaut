---
# Sealed for the exact name+namespace below (kubeseal's default "strict" scope
# binds encryption to name+namespace) -- only decrypts correctly when installed
# into the "kubernaut" namespace. Re-seal with `kubeseal --cert=helm/mycert.pem`
# if the target name, namespace, or any secret value ever changes.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: kubernaut-api-secrets
  namespace: kubernaut
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  encryptedData:
    DATABASE_URL: 
    GH_TOKEN: 
    GIT_AUTHOR_EMAIL: 
    GIT_AUTHOR_NAME: 
    GIT_COMMITTER_EMAIL: 
    GIT_COMMITTER_NAME: 
    LANGSMITH_API_KEY: 
    LANGSMITH_ENDPOINT: 
    LANGSMITH_PROJECT: 
    LANGSMITH_TRACING: 
    OPENROUTER_API_KEY: 
  template:
    metadata:
      name: kubernaut-api-secrets
      namespace: kubernaut
      labels:
        {{- include "kubernaut.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
