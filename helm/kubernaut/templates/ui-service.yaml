apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  selector:
    {{- include "kubernaut.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports:
    - port: 3000
      targetPort: 3000
