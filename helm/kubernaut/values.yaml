api:
  image:
    repository: kubernaut-api
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  existingSecret: kubernaut-api-secrets
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ui:
  image:
    repository: kubernaut-ui
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

k8sMcpServer:
  image:
    repository: kubernaut-k8s-mcp-server
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheusMcpServer:
  image:
    repository: kubernaut-prometheus-mcp-server
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  prometheusUrl: http://prometheus-server.monitoring.svc.cluster.local:9090
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
