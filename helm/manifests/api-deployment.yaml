apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernaut-api
  labels:
    app.kubernetes.io/name: kubernaut
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernaut
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernaut
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: kubernaut-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: K8S_MCP_SERVER_URL
              value: http://kubernaut-k8s-mcp-server:8000/mcp
            - name: PROMETHEUS_MCP_SERVER_URL
              value: http://kubernaut-prometheus-mcp-server:8000/mcp
          envFrom:
            - secretRef:
                name: kubernaut-api-secrets
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
