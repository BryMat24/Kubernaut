apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernaut-k8s-mcp-server
  labels:
    app.kubernetes.io/name: kubernaut
    app.kubernetes.io/component: k8s-mcp-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernaut-k8s-mcp-server
subjects:
  - kind: ServiceAccount
    name: kubernaut-k8s-mcp-server
    # Hardcoded: raw manifests aren't templated. If applying into a namespace
    # other than "default", update this to match or the k8s-mcp-server pod
    # will silently run without its ClusterRole permissions.
    namespace: default
