apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-sa
---
apiVersion: v1
kind: Pod
metadata:
  name: sample-app
  labels:
    app: sample-app
spec:
  serviceAccountName: sample-sa
  restartPolicy: OnFailure
  containers:
    - name: app
      image: bitnami/kubectl:latest
      command: ["kubectl", "get", "pods"]
