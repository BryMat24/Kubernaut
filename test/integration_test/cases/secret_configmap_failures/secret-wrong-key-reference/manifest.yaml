apiVersion: v1
kind: Secret
metadata:
  name: sample-secret
type: Opaque
stringData:
  password: s3cr3t
---
apiVersion: v1
kind: Pod
metadata:
  name: sample-app
  labels:
    app: sample-app
spec:
  containers:
    - name: app
      image: nginx:latest
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sample-secret
              key: db_password
