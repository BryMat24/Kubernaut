apiVersion: v1
kind: ResourceQuota
metadata:
  name: sample-quota
spec:
  hard:
    pods: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  labels:
    app: sample-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: app
          image: nginx:latest
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
