apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  labels:
    app: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: app
          image: busybox:latest
          command: ["sh", "-c", "while true; do echo 'FATAL: unable to connect to upstream dependency, requests are failing'; sleep 5; done"]
